# Сайт на GitHub Pages: публикация при каждом изменении и каждые 10 минут — свежие дополнения родных.
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow || true
      - id: fetch
        run: python3 tools/fetch_entries.py
      - if: github.event_name != 'schedule' || steps.fetch.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'schedule' || steps.fetch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: github.event_name != 'schedule' || steps.fetch.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
